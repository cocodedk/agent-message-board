name: Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version bump (first release is 0.1.0)
        type: choice
        default: patch
        options: [patch, minor, major]
permissions:
  contents: write
  id-token: write
  attestations: write
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: bash scripts/verify.sh
      - name: Plan tag and build version-stamped source ZIP
        run: python scripts/release.py build "${{ inputs.bump }}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/agent-message-board.zip
      - name: Recover or publish the complete release
        run: python scripts/release.py publish
