name: Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version bump (first release is 0.1.0)
        type: choice
        default: patch
        options: [patch, minor, major]
permissions:
  contents: write
  id-token: write
  attestations: write
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: bash scripts/verify.sh
      - name: Plan tag and build version-stamped source ZIP
        run: python scripts/release.py build "${{ inputs.bump }}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/agent-message-board.zip
      - name: Recover or publish the complete release
        run: python scripts/release.py publish
